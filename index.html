<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Panorama VR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;color:#fff;touch-action:none}
#viewer{position:fixed;inset:0;background:#000}
canvas{display:block;width:100%;height:100%}
#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#050505}
.card{width:min(520px,calc(100% - 28px));padding:30px 24px;border-radius:18px;background:#151515;border:1px solid #2b2b2b;text-align:center}
.card h1{margin:0 0 10px;font-size:28px}.card p{margin:0 0 20px;color:#aaa;line-height:1.45}
#fileInput{display:none}.pick{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:12px;background:#fff;color:#111;font-weight:700;cursor:pointer}.note{margin-top:13px;color:#777;font-size:12px}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{max-width:65%;padding:9px 12px;border-radius:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.actions{display:flex;gap:7px;pointer-events:auto}.actions button,.bottom button{width:42px;height:42px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(10px)}
.actions button:hover,.bottom button:hover{background:rgba(255,255,255,.16)}
.bottom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;border-radius:13px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);pointer-events:auto}.count{min-width:60px;text-align:center;font-size:13px;color:#ddd}
#hint{position:fixed;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 20px;border-radius:13px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);text-align:center;line-height:1.45;opacity:0;transition:opacity .25s;pointer-events:none}#hint.show{opacity:1}
#status{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:12;padding:8px 12px;border-radius:9px;background:rgba(0,0,0,.65);font-size:12px;color:#ccc;opacity:0;transition:opacity .2s;pointer-events:none}.showStatus{opacity:1!important}
@media(max-width:600px){.card{padding:24px 18px}.card h1{font-size:24px}.top{top:8px;left:8px;right:8px}.actions button,.bottom button{width:40px;height:40px}.bottom{bottom:9px}.name{max-width:55%}}
</style>
</head>
<body>
<div id="viewer"></div>

<div id="start">
  <div class="card">
    <h1>Panorama VR</h1>
    <p>Выбери одну или несколько панорам с телефона или ПК. Файлы остаются только в браузере.</p>
    <label class="pick" for="fileInput">Выбрать панорамы</label>
    <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple>
    <div class="note">Для горизонтальных панорам чёрная область сверху и снизу сохраняется специально.</div>
  </div>
</div>

<div id="ui" hidden>
  <div class="top">
    <div class="name" id="name">—</div>
    <div class="actions">
      <button id="change" title="Выбрать другие">📂</button>
      <button id="reset" title="Сбросить вид">⟳</button>
      <button id="full" title="Полный экран">⛶</button>
    </div>
  </div>
  <div class="bottom">
    <button id="prev" title="Предыдущая">←</button>
    <div class="count" id="count">0 / 0</div>
    <button id="next" title="Следующая">→</button>
  </div>
</div>
<div id="hint">Двигай мышью или пальцем, чтобы смотреть вокруг.<br>Колесо или два пальца — приблизить.<br>На Quest нажми VR.</div>
<div id="status"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js';

const viewer=document.getElementById('viewer');
const start=document.getElementById('start');
const ui=document.getElementById('ui');
const fileInput=document.getElementById('fileInput');
const nameEl=document.getElementById('name');
const countEl=document.getElementById('count');
const hint=document.getElementById('hint');
const status=document.getElementById('status');

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.01,1000);
scene.add(camera);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.xr.enabled=true;
viewer.appendChild(renderer.domElement);

const sphereGeo=new THREE.SphereGeometry(100,128,64);
sphereGeo.scale(-1,1,1);
const sphereMat=new THREE.MeshBasicMaterial({color:0xffffff});
const sphere=new THREE.Mesh(sphereGeo,sphereMat);
scene.add(sphere);

const vrButton=VRButton.createButton(renderer);
vrButton.style.position='fixed';
vrButton.style.right='12px';
vrButton.style.bottom='12px';
vrButton.style.left='auto';
vrButton.style.width='auto';
vrButton.style.height='42px';
vrButton.style.padding='0 16px';
vrButton.style.borderRadius='11px';
vrButton.style.border='1px solid rgba(255,255,255,.14)';
vrButton.style.font='600 14px Arial,sans-serif';
vrButton.style.background='rgba(0,0,0,.65)';
vrButton.style.zIndex='30';
vrButton.style.display='none';
document.body.appendChild(vrButton);

const panoramas=[];
let current=0;
let currentTexture=null;
let yaw=0,pitch=0,targetYaw=0,targetPitch=0;
let fov=75,targetFov=75;
let dragging=false,lastX=0,lastY=0;
let pinch=null;
let hideInfoTimer=null;

function showStatus(text){
  status.textContent=text;
  status.classList.add('showStatus');
  clearTimeout(hideInfoTimer);
  hideInfoTimer=setTimeout(()=>status.classList.remove('showStatus'),2500);
}

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Не удалось открыть изображение'))};
    img.src=url;
  });
}

/*
  КЛЮЧЕВОЕ ИЗМЕНЕНИЕ:
  исходная горизонтальная фотография НЕ растягивается по вертикали.
  Мы создаём equirectangular-холст 2:1 и кладём исходник в центр.
  Всё свободное место остаётся настоящим чёрным.

  Пример 2048x490:
  2048x1024 итоговый холст
  верхние 267 px = чёрные
  490 px = фотография
  нижние 267 px = чёрные
*/
function makeEquirectangularTexture(img){
  const targetW=img.naturalWidth;
  const targetH=Math.round(targetW/2);
  const canvas=document.createElement('canvas');
  canvas.width=targetW;
  canvas.height=targetH;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,targetW,targetH);

  let drawW=targetW;
  let drawH=img.naturalHeight;

  /*
     Если исходник выше, чем половина ширины, уменьшаем его,
     чтобы не вылезти из 2:1. Соотношение сторон сохраняем.
  */
  if(drawH>targetH){
    drawH=targetH;
    drawW=Math.round(drawH*(img.naturalWidth/img.naturalHeight));
  }

  /* Для обычной горизонтальной панорамы ширина остаётся полной. */
  const dx=Math.round((targetW-drawW)/2);
  const dy=Math.round((targetH-drawH)/2);
  ctx.drawImage(img,dx,dy,drawW,drawH);

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.minFilter=THREE.LinearFilter;
  texture.magFilter=THREE.LinearFilter;
  texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  texture.needsUpdate=true;
  return texture;
}

async function show(index){
  if(!panoramas.length)return;
  current=(index+panoramas.length)%panoramas.length;
  const file=panoramas[current];
  showStatus('Подготовка панорамы…');
  const img=await loadImage(file);
  const texture=makeEquirectangularTexture(img);

  if(currentTexture)currentTexture.dispose();
  currentTexture=texture;
  sphereMat.map=texture;
  sphereMat.needsUpdate=true;

  nameEl.textContent=file.name;
  countEl.textContent=`${current+1} / ${panoramas.length}`;
  targetYaw=0;
  targetPitch=0;
  targetFov=75;
  showStatus(`${img.naturalWidth}×${img.naturalHeight}`);
}

fileInput.addEventListener('change',()=>{
  const chosen=[...fileInput.files].filter(f=>f.type.startsWith('image/'));
  if(!chosen.length)return;
  panoramas.splice(0,panoramas.length,...chosen);
  start.style.display='none';
  ui.hidden=false;
  vrButton.style.display='block';
  show(0);
});

document.getElementById('change').onclick=()=>fileInput.click();
document.getElementById('next').onclick=()=>show(current+1);
document.getElementById('prev').onclick=()=>show(current-1);

document.getElementById('reset').onclick=()=>{
  targetYaw=0;targetPitch=0;targetFov=75;
};

document.getElementById('full').onclick=async()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch{}
};

renderer.domElement.addEventListener('pointerdown',e=>{
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  renderer.domElement.setPointerCapture?.(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  targetYaw-=dx*0.12;
  targetPitch-=dy*0.12;
  targetPitch=Math.max(-89,Math.min(89,targetPitch));
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{
  e.preventDefault();
  targetFov+=e.deltaY*0.04;
  targetFov=Math.max(35,Math.min(100,targetFov));
},{passive:false});

function touchDistance(t){
  const dx=t[0].clientX-t[1].clientX;
  const dy=t[0].clientY-t[1].clientY;
  return Math.hypot(dx,dy);
}
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
  }else if(e.touches.length===2){
    dragging=false;pinch=touchDistance(e.touches);
  }
},{passive:false});
renderer.domElement.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&dragging){
    const x=e.touches[0].clientX,y=e.touches[0].clientY;
    targetYaw-=(x-lastX)*0.12;
    targetPitch-=(y-lastY)*0.12;
    lastX=x;lastY=y;
    targetPitch=Math.max(-89,Math.min(89,targetPitch));
  }else if(e.touches.length===2){
    const d=touchDistance(e.touches);
    if(pinch!==null){
      targetFov-= (d-pinch)*0.08;
      targetFov=Math.max(35,Math.min(100,targetFov));
    }
    pinch=d;
  }
},{passive:false});
renderer.domElement.addEventListener('touchend',e=>{
  if(e.touches.length===0)dragging=false;
  if(e.touches.length<2)pinch=null;
});

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')show(current+1);
  if(e.key==='ArrowLeft')show(current-1);
  if(e.key==='0')document.getElementById('reset').click();
  if(e.key.toLowerCase()==='f')document.getElementById('full').click();
});

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

function render(){
  targetYaw%=360;
  yaw += (targetYaw-yaw)*0.12;
  pitch += (targetPitch-pitch)*0.12;
  fov += (targetFov-fov)*0.12;
  camera.fov=fov;
  camera.updateProjectionMatrix();
  const phi=THREE.MathUtils.degToRad(90-pitch);
  const theta=THREE.MathUtils.degToRad(yaw);
  camera.lookAt(
    100*Math.sin(phi)*Math.cos(theta),
    100*Math.cos(phi),
    100*Math.sin(phi)*Math.sin(theta)
  );
}

renderer.setAnimationLoop(()=>{
  render();
  renderer.render(scene,camera);
});

/* Показываем VR только там, где WebXR реально доступен. */
if(navigator.xr){
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
    vrButton.style.display=ok?'block':'none';
  }).catch(()=>{vrButton.style.display='none'});
}

hint.classList.add('show');
setTimeout(()=>hint.classList.remove('show'),4000);
</script>
</body>
</html>
